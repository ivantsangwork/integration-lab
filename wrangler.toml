name = "integration-lab"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# ---------------------------------------------------------------------------
# Non-secret config. PUBLIC_ORIGIN must match the redirect URI registered in
# Google Cloud Console exactly — same scheme, no trailing slash. Change it to
# the custom domain once DNS is live, and update Google and Meta at the same
# time.
# ---------------------------------------------------------------------------
[vars]
PUBLIC_ORIGIN = "https://integration-lab-c34.pages.dev"

# ---------------------------------------------------------------------------
# KV — not needed until Module 04 (the WhatsApp webhook) goes live. It stores
# recent deliveries for the trace panel and makes a redelivered message id a
# no-op instead of a duplicate action.
#
# To enable it later:
#   1. Dashboard → Storage & databases → KV → Create namespace, name it INBOX
#      (or run: npx wrangler kv namespace create INBOX)
#   2. Uncomment the block below and paste the real id
#   3. Commit and push — Pages redeploys automatically
#
# Leaving a placeholder id here fails the deploy with Error 8000022, so the
# block stays commented until the namespace actually exists.
#
# [[kv_namespaces]]
# binding = "INBOX"
# id = "paste-the-real-hex-id-here"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Secrets are NOT set here — this file is committed to git.
#
#   npx wrangler pages secret put GOOGLE_CLIENT_SECRET
#   npx wrangler pages secret put SESSION_SECRET
#   npx wrangler pages secret put META_APP_SECRET
#   npx wrangler pages secret put META_VERIFY_TOKEN
#   npx wrangler pages secret put OPENAI_API_KEY
#
# Or in the dashboard: the project → Settings → Variables and Secrets.
# GOOGLE_CLIENT_ID is not a secret and can live in [vars] if you prefer.
# ---------------------------------------------------------------------------
